# ── Server ─────────────────────────────────────────────────────────────────────
server.port=${PORT:8080}
server.servlet.context-path=/api

# ── Database ────────────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cemis}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:11111111}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA ────────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ── JSON — snake_case output to match the frontend's existing field names ───────
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=non_null

# ── Flyway ─────────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ── JWT ────────────────────────────────────────────────────────────────────────
# Generate a strong secret: openssl rand -hex 64
app.jwt.secret=${JWT_SECRET:change-me-use-openssl-rand-hex-64-in-production-minimum-256-bits-long-secret}
app.jwt.expiry-ms=${JWT_EXPIRY_MS:86400000}

# ── Email (Gmail SMTP / Google Workspace) ──────────────────────────────────────
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:train@unza.ac.zm}
spring.mail.password=${SMTP_PASS:hrkwejypoxicfofo}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Without explicit timeouts, JavaMail waits indefinitely on a stalled SMTP
# connection — nginx then kills the still-hanging request with a bare 504
# instead of the caller ever seeing a real error. Fail fast instead.
spring.mail.properties.mail.smtp.connectiontimeout=15000
spring.mail.properties.mail.smtp.timeout=30000
spring.mail.properties.mail.smtp.writetimeout=60000

app.mail.from=${SMTP_FROM:UNZA TeLS <train@unza.ac.zm>}

# ── Certificate PDF storage ─────────────────────────────────────────────────────
# Absolute path on the server where PDF files are stored
app.cert.pdf-dir=${CERT_PDF_DIR:./cert-pdfs}

# ── Branding assets storage ─────────────────────────────────────────────────────
app.branding.dir=${BRANDING_DIR:./branding-assets}

# ── Backup ─────────────────────────────────────────────────────────────────────
# Path to the pg_dump binary used by the admin "Backup & export" full-archive
# download. Override if it's not on PATH (e.g. Windows dev machines).
app.backup.pg-dump-path=${PG_DUMP_PATH:pg_dump}

# ── Certificate signing secret ─────────────────────────────────────────────────
app.cert.signing-secret=${CERT_SIGNING_SECRET:unza-tels-cert-signing-2026-change-in-production}

# ── App public URL (for verify links in emails and CORS) ───────────────────────
app.public-url=${PUBLIC_URL:http://localhost:5173}

# ── File upload limit ──────────────────────────────────────────────────────────
# Generated certificate PDFs embed the full-resolution branding background
# image, so this needs real headroom — keep in sync with nginx's
# client_max_body_size in deploy/nginx-cemis.conf.
spring.servlet.multipart.max-file-size=${UPLOAD_MAX_SIZE:25MB}
spring.servlet.multipart.max-request-size=${UPLOAD_MAX_SIZE:25MB}

# ── Logging ────────────────────────────────────────────────────────────────────
logging.level.zm.unza.tels.cemis=INFO
logging.level.org.springframework.security=WARN

# ── Server ─────────────────────────────────────────────────────────────────────
server.port=8080
server.servlet.context-path=/api

# ── Database ────────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/cemis
spring.datasource.username=postgres
spring.datasource.password=11111111
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA ────────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ── JSON — snake_case output to match the frontend's existing field names ───────
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=non_null

# ── Flyway ─────────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ── JWT ────────────────────────────────────────────────────────────────────────
# Generate a strong secret: openssl rand -hex 64
app.jwt.secret=change-me-use-openssl-rand-hex-64-in-production-minimum-256-bits-long-secret
app.jwt.expiry-ms=86400000

# ── Email (Gmail SMTP / Google Workspace) ──────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=train@unza.ac.zm
spring.mail.password=hrkwejypoxicfofo
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from=UNZA TeLS <train@unza.ac.zm>

# ── Certificate PDF storage ─────────────────────────────────────────────────────
# Absolute path on the server where PDF files are stored
app.cert.pdf-dir=./cert-pdfs

# ── Certificate signing secret ─────────────────────────────────────────────────
app.cert.signing-secret=unza-tels-cert-signing-2026-change-in-production

# ── App public URL (for verify links in emails) ────────────────────────────────
app.public-url=http://localhost:5173

# ── File upload limit ──────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── Logging ────────────────────────────────────────────────────────────────────
logging.level.zm.unza.tels.cemis=INFO
logging.level.org.springframework.security=WARN
